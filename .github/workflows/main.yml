name: Universal Offline Package Fetcher
on:
  workflow_dispatch:
    inputs:
      packages_list:
        description: 'Paste your list of packages (spaces or newlines are both fine)'
        required: true
        default: |
          fastapi==0.111.0 uvicorn==0.30.0
      python_version:
        description: 'Python version (e.g., 3.10, 3.11)'
        required: true
        default: '3.10'
      os_type:
        description: 'OS Platform Tag (e.g., win_amd64, manylinux2014_x86_64)'
        required: true
        default: 'win_amd64'

jobs:
  build:
    # runs-on: ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Specific Python Version
        uses: actions/setup-python@v5
        with:
          python-version: '${{ inputs.python_version }}'

      - name: Create Payload Directory
        run: mkdir -p payload/offline_packages

      - name: Generate requirements.txt
        run: |
          # Takes the input and explicitly converts any spaces into newlines 
          # so pip reads it correctly as a vertical list.
          echo "${{ inputs.packages_list }}" | tr ' ' '\n' | grep -v '^$' > requirements.txt
          
          # Display the file contents in the logs for verification
          echo "Packages to download (formatted):"
          cat requirements.txt

      - name: Download Target Packages
        run: |
          python -m pip install --upgrade pip
          # Use -r requirements.txt to download the entire list safely
          pip download -r requirements.txt -d payload/offline_packages --platform ${{ inputs.os_type }} --only-binary=:all:

      - name: Upload Dynamic Offline Bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-${{ inputs.os_type }}-${{ github.run_id }}
          path: payload/
          retention-days: 1
